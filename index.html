<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash WP Bot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; color: #f8fafc;
      background: linear-gradient(135deg, #101827, #263b63);
    }
    .card {
      width: min(100%, 480px); padding: 34px 26px; text-align: center;
      background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
      border-radius: 22px; box-shadow: 0 18px 55px rgba(0,0,0,.25);
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { color: #d5deed; line-height: 1.6; }
    .status {
      display: inline-block; margin-top: 14px; padding: 9px 15px;
      border-radius: 999px; background: #14532d; color: #bbf7d0;
      font-size: 14px;
    }
    footer { margin-top: 26px; color: #aebbd0; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🤖</div>
    <h1>Akash WP Bot</h1>
    <p>Welcome! Aapki website Render par chal rahi hai.</p>
    <div class="status">● Website Online</div>
    <footer>Made with ❤️ by Akash</footer>
  </main>
</body>
</html>
